<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="어피치3 - 재미있는 플랫폼 게임! 어피치를 조종해 코인을 모으고 적을 피하며 고득점을 노려보세요. Firebase 기반의 실시간 랭킹 시스템.">
    <meta name="keywords" content="게임, 플랫폼 게임, 마리오, 어피치, 온라인게임, 랭킹">
    <meta name="author" content="APEACH3">
    <meta name="theme-color" content="#667eea">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="어피치3 - 플랫폼 게임">
    <meta property="og:description" content="어피치를 조종해 코인을 모으고 적을 피하며 고득점을 노려보세요! 실시간 랭킹 시스템과 함께 즐기는 게임.">
    <meta property="og:image" content="https://qhauddl2-netizen.github.io/apeach3/og.png">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="어피치3 - 플랫폼 게임">
    <meta name="twitter:description" content="어피치를 조종해 코인을 모으고 적을 피하며 고득점을 노려보세요!">
    <meta name="twitter:image" content="https://qhauddl2-netizen.github.io/apeach3/og.png">

    <title>어피치3</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <button id="fullRankingBtn" class="global-ranking-btn">전체랭킹보기</button>
    <!-- 로그인 화면 -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <h1><img src="img/me.png" alt="" style="width:30px;"> APEACH3</h1>

            <!-- 모드 토글 버튼 -->
            <div class="auth-mode-toggle">
                <button id="loginModeBtn" class="mode-btn active">로그인</button>
                <button id="signupModeBtn" class="mode-btn">회원가입</button>
            </div>

            <!-- 로그인 폼 -->
            <div class="login-form" id="loginForm">
                <input type="email" id="loginEmail" placeholder="이메일" maxlength="100" required>
                <input type="password" id="loginPassword" placeholder="비밀번호 (6자 이상)" minlength="6" required>
                <button id="loginSubmitBtn">로그인</button>
                <p class="login-message" id="loginMessage"></p>
            </div>

            <!-- 회원가입 폼 -->
            <div class="login-form hidden" id="signupForm">
                <input type="email" id="signupEmail" placeholder="이메일" maxlength="100" required>
                <input type="text" id="signupNickname" placeholder="닉네임" maxlength="10" required>
                <input type="password" id="signupPassword" placeholder="비밀번호 (6자 이상)" minlength="6" required>
                <input type="password" id="signupPasswordConfirm" placeholder="비밀번호 확인 (6자 이상)" minlength="6" required>
                <button id="signupSubmitBtn">회원가입</button>
                <p class="login-message" id="signupMessage"></p>
            </div>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div class="game-container hidden" id="gameContainer">
        <div class="score-panel">
            <div class="user-info">
                <span id="currentUser"></span>
                <button id="logoutBtn" class="logout-btn">로그아웃</button>
            </div>
            <div class="score">점수: <span id="score">0</span></div>
            <div class="lives">생명: <span id="lives">3</span></div>
            <div class="coins">코인: <span id="coins">0</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="game-over hidden">
            <h2>게임 오버!</h2>
            <p>최종 점수: <span id="finalScore">0</span></p>
            <div id="rankingDisplay" class="ranking-display"></div>
            <button id="restartBtn">다시 시작</button>
            <button id="viewRankingBtn">전체 랭킹 보기</button>
        </div>
        <div class="controls-info">
            <p>← → : 이동 | SPACE : 점프</p>
        </div>

        <!-- 모바일 터치 컨트롤 -->
        <div class="mobile-controls">
            <div class="direction-controls">
                <button id="jumpBtn" class="control-btn jump-btn">점프</button>
                <button id="leftBtn" class="control-btn">←</button>
                <button id="rightBtn" class="control-btn">→</button>
            </div>
        </div>
    </div>

    <!-- 랭킹 화면 -->
    <div id="rankingScreen" class="ranking-screen hidden">
        <div class="ranking-container">
            <h2>전체 랭킹</h2>
            <div id="fullRankingList" class="ranking-list"></div>
            <button id="closeRankingBtn">닫기</button>
        </div>
    </div>


        <script type="module">
            // Import the functions you need from the SDKs you need
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
            import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";
            import { getAuth } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
            import {
                createUserWithEmailAndPassword,
                signInWithEmailAndPassword,
                signOut,
                updateProfile,
                onAuthStateChanged
            } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
            import {
                getFirestore,
                doc,
                getDoc,
                setDoc,
                addDoc,
                collection,
                query,
                orderBy,
                limit,
                getDocs,
                serverTimestamp
            } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

            // Your web app's Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyC7WSarYMryIsfxvu4HqSyTOoNBQm0xVIk",
                authDomain: "apeach-6a42c.firebaseapp.com",
                projectId: "apeach-6a42c",
                storageBucket: "apeach-6a42c.firebasestorage.app",
                messagingSenderId: "546839254226",
                appId: "1:546839254226:web:61cf44a3086841d33ec90b",
                measurementId: "G-ZQSX4SFR7P"
            };

            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const analytics = getAnalytics(app);

            // Expose firestore helpers to non-module scripts
            const db = getFirestore(app);
            const auth = getAuth(app);

            // Attach to window for legacy scripts
            window.firebaseApp = app;
            window.firebaseAnalytics = analytics;
            window.db = db;
            window.auth = auth;
            window.firebaseFns = {
                // Firestore
                doc, getDoc, setDoc, addDoc, collection, query, orderBy, limit, getDocs, serverTimestamp,
                // Auth
                createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile, onAuthStateChanged
            };

            // Firebase 준비 완료 신호
            window.firebaseReady = true;
            console.log('Firebase initialized and exposed to window');
        </script>

    <script src="auth.js"></script>
    <script src="game.js"></script>
</body>
</html>
